# 出厂默认的供应商与模型表（M0 时拷到 config/providers.yaml）。
# 写作模型（M5 第 7a 步起）：能选哪些模型以厂商「测试连接」拉到的列表为准、用户在服务页勾选；这里的 models
# 是参考表（显示名、按站点的单价、上下文、请求字段），列表里有、表里没有的按厂商的 model_defaults 调用、价格未知。
# 价格截至 2026-10-14，来源见 docs/studio/PLAN.md 的「来源」。
# verify: true 表示接口地址或模型 ID 没有逐一核对过：上线前对照 docs 链接核对，
# 或在「模型与兜底 → 测试连接」里用 GET /models 拉取真实 ID 后再填。
# model_id 为 null 的必须先填。用户在界面里改的值存数据库，不回写本文件。

as_of: "2026-10-14"
currency_rates:            # 只用于把人民币单价折算成美元显示；以记账当天汇率为准
  CNY_per_USD: 7.1

# ---------------------------------------------------------------------------
# 写作类 LLM：全部走 OpenAI 兼容协议（OpenAICompatAdapter）
# price 单位：每百万 token，in / out
# max_context：上下文窗口（token）。长小说按兜底链里最小的那个分块（每块不超过 60%）；
# 没填的按 32k 算——宁可多分几块，也不按没核对过的数字塞满。
# request：每次调用都带上的额外请求字段（如关掉「思考」），不会覆盖 model、messages 这些。
# ---------------------------------------------------------------------------
llm_providers:
  - id: deepseek
    name: DeepSeek
    base_url: https://api.deepseek.com/v1
    key_name: DEEPSEEK_API_KEY
    docs: https://api-docs.deepseek.com/quick_start/pricing
    # 2026-10-20 按官方文档核对（M2 第 13 步）：模型 ID、价格（高峰价、缓存未命中）、上下文 1M。
    # 两个模型默认开「思考」：思考过程按输出计费、也占 max_tokens（JSON 可能被截断），估价
    # 也没算它，所以流水线调用默认关掉（request.thinking）；要开就在这里改成 enabled。
    verify: false
    model_defaults: { json_mode: true, request: { thinking: { type: disabled } } }
    models:
      - key: deepseek/v4-pro
        display: DeepSeek V4 Pro
        model_id: deepseek-v4-pro          # DeepSeek-V4-Pro-0813
        price: { in: 1.32, out: 3.96, currency: USD }
        offpeak: { factor: 0.5, note: "闲时半价：高峰是 UTC 周一至周五 01:00–04:00、06:00–10:00（中国法定假日全天闲时）" }
        json_mode: true
        max_context: 1000000
        request: { thinking: { type: disabled } }
      - key: deepseek/v4.1-flash
        display: DeepSeek V4.1 Flash
        model_id: deepseek-flash           # DeepSeek-V4.1-Flash-1017（旧名 deepseek-v4-flash 已退役）
        price: { in: 0.30, out: 1.20, currency: USD }
        offpeak: { factor: 0.5, note: "闲时半价：高峰是 UTC 周一至周五 01:00–04:00、06:00–10:00（中国法定假日全天闲时）" }
        json_mode: true
        max_context: 1000000
        request: { thinking: { type: disabled } }

  # 国内站 / 国际站（M5 第 7a 步，Kelvin 2026-10-26 定：默认国内站）：两个站是独立账号，地址和密钥都不通用；
  # 「模型与兜底 → 服务」里按厂商切换。sites 写两个站，default_site 是没选过时用的；价格按默认站写，
  # 另一个站的写在模型的 by_site 里。2026-10-26 按两站官方价格页核对（DECISIONS「M5 第 7a 步」）。
  - id: moonshot
    name: Moonshot（Kimi）
    default_site: cn
    sites:
      cn:   { base_url: https://api.moonshot.cn/v1, key_name: MOONSHOT_API_KEY,      docs: https://platform.kimi.com/docs/pricing/chat }
      intl: { base_url: https://api.moonshot.ai/v1, key_name: MOONSHOT_INTL_API_KEY, docs: https://platform.kimi.ai/docs/pricing/chat }
    # K2.6：默认开思考，thinking: disabled 关掉（关掉后 temperature 固定 0.6，我们不传）。上下文 262,144。
    # K2 系列 2026-10-31 起不对新用户开放、2026 年底退役（两站价格页都这么写）。
    verify: false
    model_defaults: { json_mode: true }
    models:
      # K3.1 Pro：思考关不掉，只能调强度 reasoning_effort（low / high / max，默认 max）；思考按输出计费、
      # 也占 max_tokens，流水线默认 low（Kelvin 2026-10-26 定）。上下文 1,048,576，不分档。
      - key: moonshot/kimi-k3.1-pro
        display: Kimi K3.1 Pro
        model_id: kimi-k3.1-pro
        price: { in: 13, out: 68, currency: CNY }
        by_site: { intl: { price: { in: 2.00, out: 10.00, currency: USD } } }
        json_mode: true
        max_context: 1048576
        request: { reasoning_effort: low }
      - key: moonshot/kimi-k2.6
        display: Kimi K2.6
        model_id: kimi-k2.6
        price: { in: 6.5, out: 27, currency: CNY }
        by_site: { intl: { price: { in: 0.95, out: 4.00, currency: USD } } }
        json_mode: true
        max_context: 262144
        request: { thinking: { type: disabled } }

  - id: dashscope
    name: 阿里云百炼（Qwen）
    default_site: cn
    sites:
      cn:   { base_url: https://dashscope.aliyuncs.com/compatible-mode/v1,      key_name: DASHSCOPE_API_KEY,      docs: https://help.aliyun.com/zh/model-studio/model-pricing }
      intl: { base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1, key_name: DASHSCOPE_INTL_API_KEY, docs: https://www.alibabacloud.com/help/en/model-studio/model-pricing }
    # 国内价按北京（华北2），国际价按新加坡。三个都默认开思考，enable_thinking: false 关掉（思考不另收费）。
    # qwen3.7-plus 按输入长度分档，这里是 256K 以内那一档（256K–1M 是三倍）；两站都标「限时 8 折」，这里写原价。
    # 上下文没写明（价格档到 1M），仍按 32k 分块；没有密钥，没真调过。
    verify: false
    model_defaults: { json_mode: true, request: { enable_thinking: false } }
    models:
      - { key: qwen/qwen3.8-max,   display: Qwen3.8-max,   model_id: qwen3.8-max,   price: { in: 12, out: 36, currency: CNY },  by_site: { intl: { price: { in: 2.00, out: 6.00, currency: USD } } }, json_mode: true, request: { enable_thinking: false } }
      - { key: qwen/qwen3.7-plus,  display: Qwen3.7-plus,  model_id: qwen3.7-plus,  price: { in: 2, out: 8, currency: CNY },    by_site: { intl: { price: { in: 0.40, out: 1.60, currency: USD } } }, json_mode: true, request: { enable_thinking: false } }
      - { key: qwen/qwen3.8-flash, display: Qwen3.8-flash, model_id: qwen3.8-flash, price: { in: 0.8, out: 2.7, currency: CNY },  by_site: { intl: { price: { in: 0.15, out: 0.47, currency: USD } } }, json_mode: true, request: { enable_thinking: false } }

  - id: volcengine
    name: 火山引擎（豆包）
    base_url: https://ark.cn-beijing.volces.com/api/v3
    key_name: ARK_API_KEY
    docs: https://tech.ifeng.com/c/8uBqB6LMgIn
    verify: true
    model_defaults: { json_mode: true }
    models:
      - { key: volc/doubao-2.1-pro, display: 豆包 2.1 Pro, model_id: null, price: { in: 6, out: 30, currency: CNY }, json_mode: true }

  - id: zhipu
    name: 智谱（GLM）
    default_site: cn
    sites:
      cn:   { base_url: https://open.bigmodel.cn/api/paas/v4, key_name: ZHIPU_API_KEY,      docs: https://docs.bigmodel.cn/cn/guide/start/pricing }
      intl: { base_url: https://api.z.ai/api/paas/v4,         key_name: ZHIPU_INTL_API_KEY, docs: https://docs.z.ai/guides/overview/pricing }
    # GLM-5.3 / 5.3-Flash 总是思考，关不掉（发 thinking: disabled 会报错）；上下文 1M、最多输出 128K。
    # 国内的 5.3-Flash 不免费（免费的是 GLM-4.x Flash）。JSON 模式文档只拿 glm-5 / 5.2 举例，5.3 没明说。
    verify: false
    model_defaults: { json_mode: true }
    models:
      - { key: zhipu/glm-5.3,       display: GLM-5.3,       model_id: glm-5.3,       price: { in: 8, out: 28, currency: CNY },    by_site: { intl: { price: { in: 1.40, out: 4.40, currency: USD } } }, json_mode: true, max_context: 1000000 }
      - { key: zhipu/glm-5.3-flash, display: GLM-5.3-Flash, model_id: glm-5.3-flash, price: { in: 0.8, out: 2.8, currency: CNY }, by_site: { intl: { price: { in: 0.15, out: 0.50, currency: USD } } }, json_mode: true, max_context: 1000000 }

  - id: minimax_llm
    name: MiniMax
    # 默认国内站（Kelvin 2026-10-21 定：配音和音色设计约是国际站的一半）。写作、配音、视频共用一个账号，
    # 换站时下面配音、视频的价格跟着 by_site 换。
    default_site: cn
    sites:
      cn:   { base_url: https://api.minimax.cn/v1, key_name: MINIMAX_API_KEY,      docs: https://platform.minimax.cn/docs/pricing/overview }
      intl: { base_url: https://api.minimax.io/v1, key_name: MINIMAX_INTL_API_KEY, docs: https://platform.minimax.io/docs/pricing/overview }
    # MiniMax-M3：两站标的都是「永久五折」后的价（512K 以内；以上翻倍）；默认开思考，thinking: disabled 关掉；
    # 上下文 1M。Chat Completions 的文档里没有 response_format，所以不开 JSON 模式（提示词里要求 JSON）。
    verify: false
    model_defaults: { json_mode: false, request: { thinking: { type: disabled } } }
    models:
      - { key: minimax/m3, display: MiniMax-M3, model_id: MiniMax-M3, price: { in: 2.10, out: 8.40, currency: CNY }, by_site: { intl: { price: { in: 0.30, out: 1.20, currency: USD } } }, json_mode: false, max_context: 1000000, request: { thinking: { type: disabled } } }

  - id: google_llm
    name: Google（Gemini）
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_name: GEMINI_API_KEY
    docs: https://ai.google.dev/gemini-api/docs/pricing
    verify: true
    model_defaults: { json_mode: true }
    models:
      - key: google/gemini-3.6-flash
        display: Gemini 3.6 Flash
        model_id: null
        price: { in: 0.75, out: 3.75, currency: USD }
        price_change: { from: "2027-01-01", factor: 2.0, note: "官方公告 2027-01-01 起翻倍" }
        vision: true
        json_mode: true
      - { key: google/gemini-3.1-flash-lite, display: Gemini 3.1 Flash-Lite, model_id: null, price: { in: 0.25, out: 1.50, currency: USD }, vision: true, json_mode: true }

  - id: openai_llm
    name: OpenAI
    base_url: https://api.openai.com/v1
    key_name: OPENAI_API_KEY
    docs: https://www.eesel.ai/blog/gpt-6-luna-pricing
    verify: true
    model_defaults: { json_mode: true }
    models:
      - { key: openai/gpt-6-luna, display: GPT-6 Luna, model_id: null, price: { in: 0.10, out: 0.50, currency: USD }, note: "价格来自第三方整理", json_mode: true }

  - id: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    key_name: OPENROUTER_API_KEY
    docs: https://openrouter.ai/docs/faq
    fee: { credit_purchase_pct: 5.5 }
    verify: true
    models:
      - { key: openrouter/claude-sonnet-5.5, display: Claude Sonnet 5.5（经 OpenRouter）, model_id: null, price: null, note: "按 OpenRouter 实时价" }
      - { key: openrouter/any, display: 任意模型, model_id: null, price: null, note: "用户自填" }

  - id: custom
    name: 自定义（OpenAI 兼容）
    base_url: null
    key_name: CUSTOM_API_KEY
    models: []                   # 用户在界面里加，存 custom_model 表

  - id: local_llm
    name: 本地 LLM 服务
    base_url: http://127.0.0.1:11434/v1      # Ollama；llama.cpp server 默认 http://127.0.0.1:8080/v1
    key_name: null
    where: local
    # 让 Ollama 按 max_context 开上下文（请求体 options.num_ctx；它的默认值只有 2–4k，会悄悄截断长提示词）。
    # 是否被 OpenAI 兼容接口接受没有核对过（DECISIONS 2026-10-19 · 设定提取），本地冒烟时看 model_call 的输入 token。
    send_num_ctx: true
    models:
      - { key: local/qwen3.6-27b,   display: Qwen3.6-27B（本地）,   model_id: null, price: { in: 0, out: 0, currency: USD }, max_context: 32768, needs: [llmsrv, w_llm] }
      - { key: local/qwen3-30b-a3b, display: Qwen3-30B-A3B（本地）, model_id: null, price: { in: 0, out: 0, currency: USD }, max_context: 32768, needs: [llmsrv] }

# 写作类组件在模型选择器里的顺序；前 6 个直接显示，其余收进「更多供应商」
llm_ui_order:
  - deepseek/v4-pro
  - deepseek/v4.1-flash
  - moonshot/kimi-k3.1-pro
  - qwen/qwen3.8-max
  - qwen/qwen3.7-plus
  - volc/doubao-2.1-pro
  - zhipu/glm-5.3
  - minimax/m3
  - qwen/qwen3.8-flash
  - zhipu/glm-5.3-flash
  - google/gemini-3.6-flash
  - openai/gpt-6-luna
  - openrouter/claude-sonnet-5.5
  - openrouter/any
  - custom

# ---------------------------------------------------------------------------
# 媒体类 API：各写一个适配器。unit 决定怎么记用量。
# ---------------------------------------------------------------------------
media_models:
  # account：用哪个 llm_providers 账号的密钥（和它的 base_url，除非这里另写 base_url）；
  # 同一家的写作、出图、配音共用一个密钥（M3）。
  # 图像（2026-10-21 按官方文档核对，M3 第 10 步，DECISIONS 同日「第 10 步」）
  # adapter：哪个真实适配器（modelhub/media_adapters.py）；model_id 是厂商的模型 ID。
  # Google、OpenAI 按 token 计费：token_rates 是每百万 token 的价格，实际花费按返回的用量算；
  # price（每张）只用来估价。宽高按成片规格换成各家支持的尺寸（见各适配器文件头）。
  - key: google/nano-banana-pro
    kind: image
    display: Nano Banana Pro
    account: google_llm
    adapter: gemini_image
    base_url: https://generativelanguage.googleapis.com/v1beta   # 原生 generateContent，不是账号的 OpenAI 兼容地址
    model_id: gemini-3-pro-image
    unit: image
    price: 0.134            # 1K、2K 每张（1120 个输出 token）；4K 是 $0.24，我们最高用 2K
    token_rates: { text_in: 2.00, image_in: 2.00, text_out: 12.00, image_out: 120.00 }   # 思考按 text_out 计
    currency: USD
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"], max_refs: 14 }
    docs: https://ai.google.dev/gemini-api/docs/pricing
  - key: google/nano-banana-2.1
    kind: image
    display: Nano Banana 2.1
    account: google_llm
    adapter: gemini_image
    base_url: https://generativelanguage.googleapis.com/v1beta
    model_id: gemini-nano-banana-2.1   # 2026-10-26 按官方模型页核对（2026-10-06 发布，Stable）
    unit: image
    price: 0.0504           # 2K 每张（1680 个输出 token；1K $0.0336，4K $0.113）；我们的 1080p 交付走 2K
    token_rates: { text_in: 1.50, image_in: 1.50, text_out: 7.50, image_out: 30.00 }   # 思考按 text_out 计
    currency: USD
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"], max_refs: 14 }   # 官方：最多 14 张参考图
    docs: https://ai.google.dev/gemini-api/docs/models/gemini-nano-banana-2.1
  - key: openai/gpt-image-2
    kind: image
    display: GPT Image 2
    account: openai_llm
    adapter: openai_images
    model_id: gpt-image-2   # 快照 gpt-image-2-2026-04-21
    unit: image
    price: 0.23             # 估价参考：1088×1920、high 约 7.5k 输出 token
    token_rates: { text_in: 5.00, image_in: 8.00, image_out: 30.00 }
    currency: USD
    # est_tokens_per_mp：high 每百万像素约多少输出 token（1024×1536 high 约 $0.165，第三方实测）；
    # est_ref_tokens：每张参考图的输入 token（估）。max_refs 文档没写，按 gpt-image-1 的 16。
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "21:9"], max_refs: 16, est_tokens_per_mp: 3600, est_ref_tokens: 2000, request: { quality: high } }
    docs: https://developers.openai.com/api/docs/guides/image-generation
  - key: volc/seedream-5.0
    kind: image
    display: Seedream 5.0
    account: volcengine
    adapter: seedream
    model_id: doubao-seedream-5-0-flash-260915   # 5.0 flash：三档里最便宜，1K–2K 覆盖草稿和交付档
    unit: image
    price: 0.12             # 火山方舟官方价目表（2026-10-21）：输出 0.12 元 / 张，输入图免费；审核没过没出图的不收
    currency: CNY
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "21:9"], max_refs: 10 }
    docs: https://docs.volcengine.com/docs/82379/1541523
  # 视频
  # MiniMax H3 视频 V2 接口（2026-10-26 按官方文档核对，M5 第 6 步，DECISIONS 同日「M5 第 6 步」）：
  # 国内站人民币价（platform.minimaxi.com/docs/pricing/overview）：768P 0.50 元 / 秒、2K 0.80 元 / 秒；
  # 输入视频按同价每秒（我们不传参考视频）；每个任务前 5 张图免费，之后 0.20 元 / 张；音频免费。
  # 适配器 adapters/minimax_video.py；timeout_s：视频任务排队 + 生成，比默认 600 秒长。
  - key: minimax/h3-api
    kind: video
    display: MiniMax H3 API
    account: minimax_llm
    adapter: minimax_video
    model_id: MiniMax-H3
    unit: second
    price_by_res: { "768p": 0.50, "2k": 0.80 }
    input_price_per_second: 0.80
    extras: { extra_image: 0.20 }
    currency: CNY
    by_site: { intl: { price_by_res: { "768p": 0.08, "2k": 0.13 }, input_price_per_second: 0.13, extras: { extra_image: 0.04 }, currency: USD } }
    caps: { aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], fps: 24, duration_s: [4, 15], resolutions: ["768P", "2K"], max_short_edge: 1440, max_images: 9, max_videos: 3, max_audios: 3, max_files: 12, audio_needs_visual: true, prompt_ir: minimax/context-ir, timeout_s: 1800 }
    docs: https://platform.minimaxi.com/docs/api-reference/video-generation-v2-create
  # 768P 草稿重生成到 2K：输出 0.30 元 / 秒，输入视频 0.30 元 / 秒（官方示例里 base_video 记 0 秒，估价按收算），
  # 原任务的输入素材再收一次（图片超 5 张 0.15 元 / 张）。
  - key: minimax/h3-regenerate-2k
    kind: upscale
    display: H3 Regenerate-2K
    account: minimax_llm
    adapter: minimax_video
    model_id: MiniMax-H3
    unit: second
    price: 0.30
    input_price_per_second: 0.30
    extras: { extra_image: 0.15 }
    currency: CNY
    by_site: { intl: { price: 0.05, input_price_per_second: 0.05, extras: { extra_image: 0.025 }, currency: USD } }
    caps: { duration_s: [4, 15], timeout_s: 1800 }
    docs: https://platform.minimaxi.com/docs/api-reference/video-generation-v2-regeneration
  # H3 官方提示词改写（多模态，异步任务，只出提示词）：5.80 / 23.00 元每百万 token。
  - key: minimax/context-ir
    kind: llm_aux
    display: H3 Context-IR
    account: minimax_llm
    adapter: minimax_video
    model_id: MiniMax-H3
    unit: token
    price: { in: 5.80, out: 23.00 }
    currency: CNY
    by_site: { intl: { price: { in: 0.90, out: 3.60 }, currency: USD } }
    caps: { duration_s: [4, 15], timeout_s: 600 }
