# 出厂默认的供应商与模型表（M0 时拷到 config/providers.yaml）。
# 价格截至 2026-10-14，来源见 docs/studio/PLAN.md 的「来源」。
# verify: true 表示接口地址或模型 ID 没有逐一核对过：上线前对照 docs 链接核对，
# 或在「模型与兜底 → 测试连接」里用 GET /models 拉取真实 ID 后再填。
# model_id 为 null 的必须先填。用户在界面里改的值存数据库，不回写本文件。

as_of: "2026-10-14"
currency_rates:            # 只用于把人民币单价折算成美元显示；以记账当天汇率为准
  CNY_per_USD: 7.1

# ---------------------------------------------------------------------------
# 写作类 LLM：全部走 OpenAI 兼容协议（OpenAICompatAdapter）
# price 单位：每百万 token，in / out
# max_context：上下文窗口（token）。长小说按兜底链里最小的那个分块（每块不超过 60%）；
# 没填的按 32k 算——宁可多分几块，也不按没核对过的数字塞满。
# request：每次调用都带上的额外请求字段（如关掉「思考」），不会覆盖 model、messages 这些。
# ---------------------------------------------------------------------------
llm_providers:
  - id: deepseek
    name: DeepSeek
    base_url: https://api.deepseek.com/v1
    key_name: DEEPSEEK_API_KEY
    docs: https://api-docs.deepseek.com/quick_start/pricing
    # 2026-10-20 按官方文档核对（M2 第 13 步）：模型 ID、价格（高峰价、缓存未命中）、上下文 1M。
    # 两个模型默认开「思考」：思考过程按输出计费、也占 max_tokens（JSON 可能被截断），估价
    # 也没算它，所以流水线调用默认关掉（request.thinking）；要开就在这里改成 enabled。
    verify: false
    models:
      - key: deepseek/v4-pro
        display: DeepSeek V4 Pro
        model_id: deepseek-v4-pro          # DeepSeek-V4-Pro-0813
        price: { in: 1.32, out: 3.96, currency: USD }
        offpeak: { factor: 0.5, note: "闲时半价：高峰是 UTC 周一至周五 01:00–04:00、06:00–10:00（中国法定假日全天闲时）" }
        json_mode: true
        max_context: 1000000
        request: { thinking: { type: disabled } }
      - key: deepseek/v4.1-flash
        display: DeepSeek V4.1 Flash
        model_id: deepseek-flash           # DeepSeek-V4.1-Flash-1017（旧名 deepseek-v4-flash 已退役）
        price: { in: 0.30, out: 1.20, currency: USD }
        offpeak: { factor: 0.5, note: "闲时半价：高峰是 UTC 周一至周五 01:00–04:00、06:00–10:00（中国法定假日全天闲时）" }
        json_mode: true
        max_context: 1000000
        request: { thinking: { type: disabled } }

  - id: moonshot
    name: Moonshot（Kimi）
    base_url: https://api.moonshot.ai/v1        # 国内站：https://api.moonshot.cn/v1
    key_name: MOONSHOT_API_KEY
    docs: https://platform.kimi.ai/docs/pricing/chat
    # 2026-10-20 按官方 K2.6 quickstart 核对（M2 第 13 步）：模型 ID、上下文 256K、默认开思考
    # （关掉见 DeepSeek 的说明）；temperature 固定，传别的值会报错（我们不传）。价格页的表格
    # 没读到，价格仍是 2026-10-14 的来源；没有密钥，没真调过。
    verify: false
    models:
      - key: moonshot/kimi-k2.6
        display: Kimi K2.6
        model_id: kimi-k2.6
        price: { in: 0.95, out: 4.00, currency: USD }
        json_mode: true
        max_context: 256000
        request: { thinking: { type: disabled } }

  - id: dashscope
    name: 阿里云百炼（Qwen）
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1   # 国内：https://dashscope.aliyuncs.com/compatible-mode/v1
    key_name: DASHSCOPE_API_KEY
    docs: https://www.alibabacloud.com/help/en/model-studio/model-pricing
    # 2026-10-20 按官方价格页（新加坡）和「深度思考」页核对（M2 第 13 步）：模型 ID、价格
    # （qwen3.7-plus 是 256K 以内那一档）；三个都默认开思考，enable_thinking: false 关掉。
    # 上下文没写明，按 32k 分块；没有密钥，没真调过。
    verify: false
    models:
      - { key: qwen/qwen3.8-max,   display: Qwen3.8-max,   model_id: qwen3.8-max,   price: { in: 2.00, out: 6.00, currency: USD }, json_mode: true, request: { enable_thinking: false } }
      - { key: qwen/qwen3.7-plus,  display: Qwen3.7-plus,  model_id: qwen3.7-plus,  price: { in: 0.40, out: 1.60, currency: USD }, json_mode: true, request: { enable_thinking: false } }
      - { key: qwen/qwen3.8-flash, display: Qwen3.8-flash, model_id: qwen3.8-flash, price: { in: 0.15, out: 0.47, currency: USD }, json_mode: true, request: { enable_thinking: false } }

  - id: volcengine
    name: 火山引擎（豆包）
    base_url: https://ark.cn-beijing.volces.com/api/v3
    key_name: ARK_API_KEY
    docs: https://tech.ifeng.com/c/8uBqB6LMgIn
    verify: true
    models:
      - { key: volc/doubao-2.1-pro, display: 豆包 2.1 Pro, model_id: null, price: { in: 6, out: 30, currency: CNY }, json_mode: true }

  - id: zhipu
    name: 智谱（GLM）
    base_url: https://open.bigmodel.cn/api/paas/v4    # 海外：https://api.z.ai/api/paas/v4
    key_name: ZHIPU_API_KEY
    docs: https://docs.z.ai/guides/overview/pricing
    verify: true
    models:
      - { key: zhipu/glm-5.3,       display: GLM-5.3,       model_id: null, price: { in: 1.40, out: 4.40, currency: USD }, json_mode: true }
      - { key: zhipu/glm-5.3-flash, display: GLM-5.3-Flash, model_id: null, price: { in: 0.15, out: 0.50, currency: USD }, json_mode: true }

  - id: minimax_llm
    name: MiniMax
    # 用国内站（Kelvin 2026-10-21 定：配音和音色设计约是国际站的一半）。国际站 https://api.minimax.io/v1，
    # 两个是独立账号，密钥不通用；换站时连同下面配音的人民币单价一起改。
    base_url: https://api.minimax.cn/v1
    key_name: MINIMAX_API_KEY                         # 和配音、视频共用账号
    docs: https://platform.minimax.cn/docs/guides/pricing-paygo
    verify: true
    models:
      - { key: minimax/m3, display: MiniMax-M3, model_id: null, price: { in: 0.30, out: 1.20, currency: USD }, json_mode: true }

  - id: google_llm
    name: Google（Gemini）
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_name: GEMINI_API_KEY
    docs: https://ai.google.dev/gemini-api/docs/pricing
    verify: true
    models:
      - key: google/gemini-3.6-flash
        display: Gemini 3.6 Flash
        model_id: null
        price: { in: 0.75, out: 3.75, currency: USD }
        price_change: { from: "2027-01-01", factor: 2.0, note: "官方公告 2027-01-01 起翻倍" }
        vision: true
        json_mode: true
      - { key: google/gemini-3.1-flash-lite, display: Gemini 3.1 Flash-Lite, model_id: null, price: { in: 0.25, out: 1.50, currency: USD }, vision: true, json_mode: true }

  - id: openai_llm
    name: OpenAI
    base_url: https://api.openai.com/v1
    key_name: OPENAI_API_KEY
    docs: https://www.eesel.ai/blog/gpt-6-luna-pricing
    verify: true
    models:
      - { key: openai/gpt-6-luna, display: GPT-6 Luna, model_id: null, price: { in: 0.10, out: 0.50, currency: USD }, note: "价格来自第三方整理", json_mode: true }

  - id: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    key_name: OPENROUTER_API_KEY
    docs: https://openrouter.ai/docs/faq
    fee: { credit_purchase_pct: 5.5 }
    verify: true
    models:
      - { key: openrouter/claude-sonnet-5.5, display: Claude Sonnet 5.5（经 OpenRouter）, model_id: null, price: null, note: "按 OpenRouter 实时价" }
      - { key: openrouter/any, display: 任意模型, model_id: null, price: null, note: "用户自填" }

  - id: custom
    name: 自定义（OpenAI 兼容）
    base_url: null
    key_name: CUSTOM_API_KEY
    models: []                   # 用户在界面里加，存 custom_model 表

  - id: local_llm
    name: 本地 LLM 服务
    base_url: http://127.0.0.1:11434/v1      # Ollama；llama.cpp server 默认 http://127.0.0.1:8080/v1
    key_name: null
    where: local
    # 让 Ollama 按 max_context 开上下文（请求体 options.num_ctx；它的默认值只有 2–4k，会悄悄截断长提示词）。
    # 是否被 OpenAI 兼容接口接受没有核对过（DECISIONS 2026-10-19 · 设定提取），本地冒烟时看 model_call 的输入 token。
    send_num_ctx: true
    models:
      - { key: local/qwen3.6-27b,   display: Qwen3.6-27B（本地）,   model_id: null, price: { in: 0, out: 0, currency: USD }, max_context: 32768, needs: [llmsrv, w_llm] }
      - { key: local/qwen3-30b-a3b, display: Qwen3-30B-A3B（本地）, model_id: null, price: { in: 0, out: 0, currency: USD }, max_context: 32768, needs: [llmsrv] }

# 写作类组件在模型选择器里的顺序；前 6 个直接显示，其余收进「更多供应商」
llm_ui_order:
  - deepseek/v4-pro
  - deepseek/v4.1-flash
  - moonshot/kimi-k2.6
  - qwen/qwen3.8-max
  - qwen/qwen3.7-plus
  - volc/doubao-2.1-pro
  - zhipu/glm-5.3
  - minimax/m3
  - qwen/qwen3.8-flash
  - zhipu/glm-5.3-flash
  - google/gemini-3.6-flash
  - openai/gpt-6-luna
  - openrouter/claude-sonnet-5.5
  - openrouter/any
  - custom

# ---------------------------------------------------------------------------
# 媒体类 API：各写一个适配器。unit 决定怎么记用量。
# ---------------------------------------------------------------------------
media_models:
  # account：用哪个 llm_providers 账号的密钥（和它的 base_url，除非这里另写 base_url）；
  # 同一家的写作、出图、配音共用一个密钥（M3）。
  # 图像（2026-10-21 按官方文档核对，M3 第 10 步，DECISIONS 同日「第 10 步」）
  # adapter：哪个真实适配器（modelhub/media_adapters.py）；model_id 是厂商的模型 ID。
  # Google、OpenAI 按 token 计费：token_rates 是每百万 token 的价格，实际花费按返回的用量算；
  # price（每张）只用来估价。宽高按成片规格换成各家支持的尺寸（见各适配器文件头）。
  - key: google/nano-banana-pro
    kind: image
    display: Nano Banana Pro
    account: google_llm
    adapter: gemini_image
    base_url: https://generativelanguage.googleapis.com/v1beta   # 原生 generateContent，不是账号的 OpenAI 兼容地址
    model_id: gemini-3-pro-image
    unit: image
    price: 0.134            # 1K、2K 每张（1120 个输出 token）；4K 是 $0.24，我们最高用 2K
    token_rates: { text_in: 2.00, image_in: 2.00, text_out: 12.00, image_out: 120.00 }   # 思考按 text_out 计
    currency: USD
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"], max_refs: 14 }
    docs: https://ai.google.dev/gemini-api/docs/pricing
  - key: google/nano-banana-2.1
    kind: image
    display: Nano Banana 2.1
    account: google_llm
    adapter: gemini_image
    base_url: https://generativelanguage.googleapis.com/v1beta
    model_id: gemini-nano-banana-2.1   # 2026-10-26 按官方模型页核对（2026-10-06 发布，Stable）
    unit: image
    price: 0.0504           # 2K 每张（1680 个输出 token；1K $0.0336，4K $0.113）；我们的 1080p 交付走 2K
    token_rates: { text_in: 1.50, image_in: 1.50, text_out: 7.50, image_out: 30.00 }   # 思考按 text_out 计
    currency: USD
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"], max_refs: 14 }   # 官方：最多 14 张参考图
    docs: https://ai.google.dev/gemini-api/docs/models/gemini-nano-banana-2.1
  - key: openai/gpt-image-2
    kind: image
    display: GPT Image 2
    account: openai_llm
    adapter: openai_images
    model_id: gpt-image-2   # 快照 gpt-image-2-2026-04-21
    unit: image
    price: 0.23             # 估价参考：1088×1920、high 约 7.5k 输出 token
    token_rates: { text_in: 5.00, image_in: 8.00, image_out: 30.00 }
    currency: USD
    # est_tokens_per_mp：high 每百万像素约多少输出 token（1024×1536 high 约 $0.165，第三方实测）；
    # est_ref_tokens：每张参考图的输入 token（估）。max_refs 文档没写，按 gpt-image-1 的 16。
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "21:9"], max_refs: 16, est_tokens_per_mp: 3600, est_ref_tokens: 2000, request: { quality: high } }
    docs: https://developers.openai.com/api/docs/guides/image-generation
  - key: volc/seedream-5.0
    kind: image
    display: Seedream 5.0
    account: volcengine
    adapter: seedream
    model_id: doubao-seedream-5-0-flash-260915   # 5.0 flash：三档里最便宜，1K–2K 覆盖草稿和交付档
    unit: image
    price: 0.12             # 火山方舟官方价目表（2026-10-21）：输出 0.12 元 / 张，输入图免费；审核没过没出图的不收
    currency: CNY
    caps: { aspects: ["1:1", "2:3", "3:2", "3:4", "4:3", "9:16", "16:9", "21:9"], max_refs: 10 }
    docs: https://docs.volcengine.com/docs/82379/1541523
  # 视频
  - key: minimax/h3-api
    kind: video
    display: MiniMax H3 API
    unit: second
    price_by_res: { "768p": 0.08, "2k": 0.13 }
    currency: USD
    caps: { aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], fps: 24, duration_s: [5, 15], max_short_edge: 1440, max_images: 9, max_videos: 3, max_audios: 3, max_files: 12, audio_needs_visual: true }
    docs: https://platform.minimax.io/docs/guides/pricing-paygo.md
  - { key: minimax/h3-regenerate-2k, kind: upscale, display: H3 Regenerate-2K, unit: second, price: 0.05, input_price_per_second: 0.05, currency: USD, note: "输出 $0.05/秒 + 输入视频 $0.05/秒" }
  - { key: minimax/context-ir, kind: llm_aux, display: H3 Context-IR, unit: token, price: { in: 0.90, out: 3.60 }, currency: USD }
  - { key: volc/seedance-2.5, kind: video, display: Seedance 2.5, unit: minute, price: 24.60, currency: USD, caps: { aspects: ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9"], max_short_edge: 720, note: "部分渠道只到 720p" }, verify: true }
  - { key: google/gemini-omni-flash-1.1, kind: video, display: Gemini Omni Flash 1.1, unit: minute, price: 9.12, currency: USD, verify: true }
  - { key: alibaba/wan-3.0, kind: video, display: Wan 3.0, unit: minute, price: 12.00, currency: USD, verify: true }
  - { key: kling/kling-3.0, kind: video, display: Kling 3.0, unit: second, price: null, verify: true }
  - { key: google/veo-3.1, kind: video, display: Veo 3.1, unit: second, price: null, verify: true }
  # 配音（2026-10-21 按官方文档核对，M3 第 11 步，DECISIONS 同日「第 11 步」）：国内站人民币价。
  # 按计费字数（返回的 usage_characters；1 个汉字算 2 个字符）：3.50 元 / 万字符 = 350 元 / 百万字符。
  # extras：音色设计 9.90 元在设计出的音色第一次合成时收（返回 usage_voice_count），不是设计时；
  # 设计时的试听 2.00 元 / 万字符。request：每次合成都带上的字段（language_boost: auto 自动判断语种）。
  - key: minimax/speech-2.8-hd
    kind: tts
    display: MiniMax Speech 2.8 HD
    account: minimax_llm
    adapter: minimax_speech
    model_id: speech-2.8-hd
    unit: char
    price_per_million: 350
    currency: CNY
    extras: { voice_design: 9.90, voice_clone: 9.90, design_preview_char: 0.0002 }
    caps: { request: { language_boost: auto } }
    docs: https://platform.minimax.cn/docs/guides/pricing-paygo
  # 只用来出耳语变体（2.8 没有 whisper，config/voice.yaml）；不在「模型与兜底」的可选列表里。
  - key: minimax/speech-2.6-hd
    kind: tts
    display: MiniMax Speech 2.6 HD
    account: minimax_llm
    adapter: minimax_speech
    model_id: speech-2.6-hd
    unit: char
    price_per_million: 350
    currency: CNY
    extras: { voice_design: 9.90, design_preview_char: 0.0002 }
    caps: { request: { language_boost: auto } }
  - { key: elevenlabs/v3, kind: tts, display: ElevenLabs v3, unit: char, price: null, docs: https://invideo.io/blog/ai-voice-model-pricing/, verify: true }
  # 口型、超分、配乐、字幕、3D
  - { key: sync/lipsync-2-pro, kind: lipsync, display: sync lipsync-2-pro, unit: second, price_range: [0.067, 0.083], currency: USD }
  - { key: topaz/starlight-precise-2.5, kind: upscale, display: Topaz Starlight Precise 2.5, unit: second, price: 0.12, currency: USD, note: "1080p，按积分换算" }
  - { key: elevenlabs/music, kind: music, display: ElevenLabs Music, unit: subscription, price: 22, currency: USD, period: month }
  - { key: elevenlabs/sfx, kind: sfx, display: ElevenLabs Sound Effects, unit: call, price: null, verify: true }
  - { key: elevenlabs/scribe, kind: asr, display: ElevenLabs Scribe, unit: minute, price: null, verify: true }
  - { key: worldlabs/marble, kind: world, display: World Labs Marble, unit: world, price: 1.2, currency: USD, enabled_by_default: false }

# 本地模型（价格 0，记时长和显存）
# needs: 跑它要有的清单项（config/setup-manifest.yaml 的 id）；requires_cuda: 要 NVIDIA 显卡。
# 扫描后缺任何一项，resolve() 就绕开它（local / hybrid 改走 API，见 core/capabilities.py）。
# 没写 needs 的（清单里还没有对应项）视为能跑，跑时失败照常兜底。
# runtime: comfyui 的模型由 workflow 指的 workflows/<slug>/ 跑（adapters/comfyui.py）；文件夹还没有的（H3 等，M5）暂不可用。
local_models:
  - { key: comfy/h3,                kind: video,   display: MiniMax H3（本地）,      runtime: comfyui, workflow: h3_i2v, caps: { aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], fps: 24, duration_s: [5, 15], max_short_edge: 1440 }, needs: [comfy, node_h3, w_h3, w_te], requires_cuda: true }
  - { key: comfy/h3-fun-controlnet, kind: video,   display: H3 Fun ControlNet（本地）, runtime: comfyui, workflow: h3_controlnet, needs: [comfy, node_h3, node_ctrl, w_h3, w_te], requires_cuda: true }
  - { key: comfy/wan-2.2,           kind: video,   display: Wan 2.2（本地）,          runtime: comfyui, needs: [comfy], requires_cuda: true }
  - { key: comfy/ltx,               kind: video,   display: LTX（本地）,              runtime: comfyui, verify: true, needs: [comfy], requires_cuda: true }
  - { key: comfy/qwen-image-edit,   kind: image,   display: Qwen-Image-Edit（本地）,  runtime: comfyui, workflow: qwen-image-edit, needs: [comfy, w_img] }
  - { key: comfy/qwen-image-edit-hq, kind: image, display: Qwen-Image-Edit 40 步（本地）, runtime: comfyui, workflow: qwen-image-edit-hq, needs: [comfy, w_img] }
  - { key: comfy/qwen-image,        kind: image,   display: Qwen-Image（本地）,       runtime: comfyui, workflow: qwen-image, needs: [comfy, w_img_t2i] }
  - { key: comfy/flux2-dev,         kind: image,   display: FLUX.2 dev（本地）,       runtime: comfyui, needs: [comfy] }
  # FLUX 3 Image Klein（BFL，2026-10-15）：权重在要登录同意许可的 HF 仓库，安装清单还没有这一项，所以没写 needs
  - { key: comfy/flux3-klein,       kind: image,   display: FLUX 3 Klein（本地）,     runtime: comfyui, workflow: flux3-klein }
  - { key: comfy/flux3-klein-t2i,   kind: image,   display: FLUX 3 Klein 文生图（本地）, runtime: comfyui, workflow: flux3-klein-t2i }
  - { key: comfy/seedvr2,           kind: upscale, display: SeedVR2（本地）,          runtime: comfyui, needs: [comfy, node_seedvr2, w_sr], requires_cuda: true }
  - { key: comfy/flashvsr,          kind: upscale, display: FlashVSR（本地）,         runtime: comfyui, needs: [comfy, node_flashvsr], requires_cuda: true }
  # runtime: python 的模型由 worker 跑（adapters/local_python.py）：worker 是 workers/ 下的脚本，env 是
  # ~/.drama-studio/envs/ 下的环境（清单 rt_* 按 runtimes/ 的锁文件装），args 是它加载什么（{models} 是 Setup 页选的
# 安装位置）；gpu: false 不占显存租约。
  - { key: local/indextts2,         kind: tts,     display: IndexTTS2（本地）,        runtime: python, worker: worker_indextts, env: indextts, args: { model_dir: "{models}/IndexTTS-2.5", cwd: "{envs}/indextts-src", bf16: true, lang: zh }, needs: [w_tts, rt_indextts], requires_cuda: true }
  - { key: local/cosyvoice,         kind: tts,     display: CosyVoice（本地）,        runtime: python }
  - { key: local/qwen3-tts,         kind: tts,     display: Qwen3-TTS（本地试听）,     runtime: python, worker: worker_qwentts, env: qwentts, args: { model: "{models}/Qwen3-TTS-12Hz-1.7B-VoiceDesign", language: Chinese }, needs: [rt_qwentts], requires_cuda: true }
  - { key: local/latentsync,        kind: lipsync, display: LatentSync（本地）,       runtime: python, requires_cuda: true }
  - { key: local/infinitetalk,      kind: lipsync, display: InfiniteTalk（本地）,     runtime: python, requires_cuda: true }
  - { key: local/qwen3-vl-32b,      kind: vlm,     display: Qwen3-VL-32B（本地）,     runtime: llm_server, needs: [llmsrv] }
  - { key: local/ace-step,          kind: music,   display: ACE-Step（本地）,         runtime: python }
  - { key: local/mmaudio,           kind: sfx,     display: MMAudio（本地）,          runtime: python, verify: true }
  - { key: local/whisper-large-v3,  kind: asr,     display: Whisper large-v3（本地）, runtime: python }
  - { key: local/paraformer,        kind: asr,     display: Paraformer（本地）,       runtime: python }
  - { key: local/rapidocr,          kind: ocr,     display: RapidOCR（本地）,         runtime: python, worker: worker_rapidocr, env: ocr, gpu: false, caps: { langs: [zh, en] }, needs: [rt_ocr] }
