# 本地模型（价格 0，记时长和显存）
# needs: 跑它要有的清单项（config/setup-manifest.yaml 的 id）；requires_cuda: 要 NVIDIA 显卡。
# 扫描后缺任何一项，resolve() 就绕开它（local / hybrid 改走 API，见 core/capabilities.py）。
# 没写 needs 的（清单里还没有对应项）视为能跑，跑时失败照常兜底。
# runtime: comfyui 的模型由 workflow 指的 workflows/<slug>/ 跑（adapters/comfyui.py）；文件夹还没有的（H3 ControlNet 等）暂不可用。
local_models:
  - { key: comfy/h3,                kind: video,   display: MiniMax H3（本地）,      runtime: comfyui, workflow: h3-i2v, caps: { aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], fps: 24, duration_s: [5, 15], max_short_edge: 1440 }, needs: [comfy, node_h3, w_h3, w_te], requires_cuda: true }
  # 配音方式 native 的镜头（锁定音色样本当 <Audio N>，Kelvin 2026-10-26 定）：参考生视频节点 + ref2va 权重，视频组件按镜头换过来
  - { key: comfy/h3-r2v,            kind: video,   display: MiniMax H3 参考生视频（本地）, runtime: comfyui, workflow: h3-r2v, caps: { aspects: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], fps: 24, duration_s: [5, 15], max_short_edge: 1440, max_refs: 4, audio_in: true }, needs: [comfy, node_h3, w_h3, w_te], requires_cuda: true }
  - { key: comfy/h3-fun-controlnet, kind: video,   display: H3 Fun ControlNet（本地）, runtime: comfyui, workflow: h3_controlnet, needs: [comfy, node_h3, node_ctrl, w_h3, w_te], requires_cuda: true }
  - { key: comfy/wan-2.2,           kind: video,   display: Wan 2.2（本地）,          runtime: comfyui, needs: [comfy], requires_cuda: true }
  - { key: comfy/ltx,               kind: video,   display: LTX（本地）,              runtime: comfyui, verify: true, needs: [comfy], requires_cuda: true }
  - { key: comfy/qwen-image-edit,   kind: image,   display: Qwen-Image-Edit（本地）,  runtime: comfyui, workflow: qwen-image-edit, needs: [comfy, w_img] }
  - { key: comfy/qwen-image-edit-hq, kind: image, display: Qwen-Image-Edit 40 步（本地）, runtime: comfyui, workflow: qwen-image-edit-hq, needs: [comfy, w_img] }
  - { key: comfy/qwen-image,        kind: image,   display: Qwen-Image（本地）,       runtime: comfyui, workflow: qwen-image, needs: [comfy, w_img_t2i] }
  - { key: comfy/flux2-dev,         kind: image,   display: FLUX.2 dev（本地）,       runtime: comfyui, needs: [comfy] }
  # FLUX 3 Image Klein（BFL，2026-10-15）：权重在要登录同意许可的 HF 仓库（清单 w_flux3，安装器还不能自动下）
  - { key: comfy/flux3-klein,       kind: image,   display: FLUX 3 Klein（本地）,     runtime: comfyui, workflow: flux3-klein, needs: [comfy, w_flux3] }
  - { key: comfy/flux3-klein-t2i,   kind: image,   display: FLUX 3 Klein 文生图（本地）, runtime: comfyui, workflow: flux3-klein-t2i, needs: [comfy, w_flux3] }
  - { key: comfy/seedvr2,           kind: upscale, display: SeedVR2（本地）,          runtime: comfyui, needs: [comfy, node_seedvr2, w_sr], requires_cuda: true }
  - { key: comfy/flashvsr,          kind: upscale, display: FlashVSR（本地）,         runtime: comfyui, needs: [comfy, node_flashvsr], requires_cuda: true }
  # runtime: python 的模型由 worker 跑（adapters/local_python.py）：worker 是 workers/ 下的脚本，env 是
  # ~/.drama-studio/envs/ 下的环境（清单 rt_* 按 runtimes/ 的锁文件装），args 是它加载什么（{models} 是 Setup 页选的
# 安装位置）；gpu: false 不占显存租约。
  - { key: local/indextts2,         kind: tts,     display: IndexTTS2（本地）,        runtime: python, worker: worker_indextts, env: indextts, args: { model_dir: "{models}/IndexTTS-2.5", cwd: "{envs}/indextts-src", bf16: true, lang: zh }, needs: [w_tts, rt_indextts], requires_cuda: true }
  - { key: local/cosyvoice,         kind: tts,     display: CosyVoice（本地）,        runtime: python }
  - { key: local/qwen3-tts,         kind: tts,     display: Qwen3-TTS（本地试听）,     runtime: python, worker: worker_qwentts, env: qwentts, args: { model: "{models}/Qwen3-TTS-12Hz-1.7B-VoiceDesign", language: Chinese }, needs: [rt_qwentts], requires_cuda: true }
  - { key: local/latentsync,        kind: lipsync, display: LatentSync（本地）,       runtime: python, requires_cuda: true }
  - { key: local/infinitetalk,      kind: lipsync, display: InfiniteTalk（本地）,     runtime: python, requires_cuda: true }
  - { key: local/qwen3-vl-32b,      kind: vlm,     display: Qwen3-VL-32B（本地）,     runtime: llm_server, needs: [llmsrv] }
  - { key: local/ace-step,          kind: music,   display: ACE-Step（本地）,         runtime: python }
  - { key: local/mmaudio,           kind: sfx,     display: MMAudio（本地）,          runtime: python, verify: true }
  - { key: local/whisper-large-v3,  kind: asr,     display: Whisper large-v3（本地）, runtime: python }
  - { key: local/paraformer,        kind: asr,     display: Paraformer（本地）,       runtime: python }
  - { key: local/rapidocr,          kind: ocr,     display: RapidOCR（本地）,         runtime: python, worker: worker_rapidocr, env: ocr, gpu: false, caps: { langs: [zh, en] }, needs: [rt_ocr] }
