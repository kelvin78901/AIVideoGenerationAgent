# 首次启动的检测与安装清单（SPEC 12.1，解析见 src/drama_series_agent/setup/manifest.py）。
# 条目和原型 Setup.dc.html 的 PC / Mac 两套一致，另加 SPEC 12.1 的 uv、node_dramastudio、eagle、resolve。
# 运行环境和节点的地址、版本 2026-10-18 按官方仓库 / 文档核对并锁定（DECISIONS「M1 清单补齐」）。git_clone 的 ref 是
# commit（安装器用 rev-parse HEAD 比对，幂等）；version 是给改动清单看的版本号。
# 权重 2026-10-18 由 Kelvin 选定版本（DECISIONS「第 8b 步」）：Hugging Face 仓库锁 revision，大小和 sha256 取自 HF 接口。
# 还写 TODO 的只剩本地 LLM；verify: true（Eagle、Resolve）要在装了它们的机器上实测确认。
# {comfy} = ComfyUI 根目录，{envs} = ~/.drama-studio/envs，{models} = 安装位置（Setup 页用户选的，放不走 ComfyUI 的权重）
#
# 每项除 SPEC 12.1 的字段外还可以有：
#   fix:        检测状态 → 建议（setup:fix.<code>），写 code 或 {code, params}；不写时按类型给默认
#   if_missing: 没找到时的状态，默认 required → missing、否则 optional
#   installable: false   有安装步骤但暂时不能装
#   size_gb:    下载体积；超过 10 GB 的安装前先确认（SPEC 12.2-5）
#   download 的 files：文件名，或 {path, folder, sha256}。写了 folder（ComfyUI 的模型类别：diffusion_models、vae …）
#               就放到 ComfyUI 放这类新文件的目录：extra_model_paths 里 is_default 的那个（ComfyUI Desktop 的共享
#               模型目录），没有就 {comfy}/models/<folder>；没写 folder 的放 dest 下。检测用 detect: { type: downloads }：
#               这些文件都在（ComfyUI 的文件在它任一模型目录里都算）就是装好了。
#   pkg 步骤的 admin: [winget, apt]   这些包管理器装它要管理员权限（默认只有 apt），安装前先确认
#   snapshot_first: false   改用户已装的 ComfyUI 时不用先存快照（只有 ComfyUI-Manager 本身，快照靠它存）
# comfy 组的项、安装步骤写进 {comfy}、ComfyUI 模型目录（folder）或 env: comfy 的项会改用户已装的 ComfyUI：安装前列改动清单确认，动手前先用
# ComfyUI-Manager 存快照（SPEC 6.4.1）。ComfyUI 是我们装的（~/.drama-studio/ComfyUI）时不算。
#   macos / windows / linux:  这个平台上覆盖 required、name、variant、fix、if_missing、installable；
#                             写 `optional` 等于 {required: false}
# 依赖的项在这个平台上不是必需的，依赖它的项也不是必需的（例如 Mac 上 ComfyUI 可选，节点也可选）。
# 需要 CUDA 的项在没有 CUDA 的机器上显示「跳过」。

version: 1
mirrors:
  official: { hf: https://huggingface.co, pypi: https://pypi.org/simple, github: https://github.com }
  # github 走代理前缀（第三方服务，2026-10-18 测过能用；不能用时改「官方源」）
  cn:       { hf: https://hf-mirror.com,  pypi: https://pypi.tuna.tsinghua.edu.cn/simple, github: https://gh-proxy.com/https://github.com }
  auto:     { strategy: speedtest }

# 扫描后推荐的路由预设（SPEC 12.2-2）：按顺序取第一条满足 when 的。
recommend:
  - { when: { cuda: true }, preset: balanced, reason: local_video }
  - { preset: balanced, reason: no_cuda }   # 视频、关键帧、超分由能力过滤改走 API（第 6 步）

items:
  # ---------- 系统（只检测） ----------
  - { id: os,     group: sys, name: { zh: 操作系统, en: Operating system }, detect: { type: platform } }
  - { id: gpu,    group: sys, name: { zh: 显卡, en: GPU }, detect: { type: nvml, fallback: apple_silicon }, fix: { warn: no_cuda_video_api }, note: "没有 CUDA 时把视频、关键帧、超分默认切到 API" }
  - { id: driver, group: sys, name: { zh: 显卡驱动, en: GPU driver }, platforms: [windows, linux], detect: { type: nvml, field: cuda_driver_version }, require: { cuda: ">=13.0" } }
  - { id: ram,    group: sys, name: { zh: 内存, en: Memory }, detect: { type: platform, field: ram } }
  - { id: disk,   group: sys, name: { zh: 磁盘空间, en: Disk space }, detect: { type: platform, field: disk_free, path: "{models}" }, require: { free_gb: ">=200" } }

  # ---------- 运行环境 ----------
  - id: python
    group: rt
    name: { zh: Python, en: Python }
    required: true
    detect: { type: command, cmd: "uv python find 3.12", version_regex: "(3\\.\\d+)" }
    install: [ { type: script, run: "uv python install 3.12" } ]
  - id: uv
    group: rt
    name: { zh: uv, en: uv }
    required: true
    detect: { type: command, cmd: "uv --version" }
    # 没有包管理器时用官方脚本（https://docs.astral.sh/uv/getting-started/installation/）：
    #   Windows: powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    #   macOS / Linux: curl -LsSf https://astral.sh/uv/install.sh | sh
    install: [ { type: pkg, winget: astral-sh.uv, brew: uv } ]
  - id: torch
    group: rt
    name: { zh: PyTorch, en: PyTorch }
    required: true
    depends_on: [python, uv]
    detect: { type: py_import, env: comfy, module: torch, check: "torch.version.cuda" }
    require: { cuda_build: "13.0", note: "NVFP4 量化需要 CUDA 13.0 版" }
    fix: { old: { code: torch_cuda, params: { cuda: "13.0" } } }
    macos: { fix: { missing: install_torch_mps } }
    install:
      # 不锁版本号（和 ComfyUI 的 requirements.txt 一样）；CUDA 13.0 版由源决定，2026-10-18 最新 2.14.1+cu130
      - { type: uv_pip, env: comfy, packages: [torch, torchvision, torchaudio], index_url: "https://download.pytorch.org/whl/cu130", platforms: [windows, linux] }
      - { type: uv_pip, env: comfy, packages: [torch, torchvision, torchaudio], platforms: [macos], note: "MPS 版" }
  - id: ffmpeg
    group: rt
    name: { zh: FFmpeg, en: FFmpeg }
    required: true
    detect: { type: command, cmd: "ffmpeg -version" }
    install: [ { type: pkg, winget: Gyan.FFmpeg, brew: ffmpeg, apt: ffmpeg } ]
  - id: git
    group: rt
    name: { zh: Git, en: Git }
    required: true
    detect: { type: command, cmd: "git --version" }
    install: [ { type: pkg, winget: Git.Git, brew: git, apt: git, admin: [winget, apt] } ]   # Git for Windows 装到 Program Files

  # ---------- ComfyUI 与节点 ----------
  - id: comfy
    group: comfy
    name: { zh: ComfyUI, en: ComfyUI }
    required: true
    depends_on: [git, torch]
    # 先找正在跑的实例（/system_stats 的 argv 里有路径），再找常见目录，最后用设置里的路径。
    detect: { type: comfy, url: "http://127.0.0.1:8188" }
    require: { version: ">=0.35.0", note: "H3 原生节点 0.30.0 起有，H3 的 Fun ControlNet 0.35.0 起有（按各版本源码核对）" }
    macos: { required: false, fix: { optional: comfy_images_only } }
    install:
      - { type: git_clone, url: https://github.com/comfyanonymous/ComfyUI, ref: 63be2f9b82ad0dac88a7ceaa28a9cf3154125a18, version: v0.42.1, dest: "{comfy}" }
      - { type: uv_pip, env: comfy, requirements: "{comfy}/requirements.txt" }
  - id: comfy_manager
    group: comfy
    name: { zh: ComfyUI-Manager（快照和回滚）, en: ComfyUI-Manager (snapshots and rollback) }
    depends_on: [comfy]
    detect: { type: comfy_manager }   # pip 包 comfyui_manager（--enable-manager）或 custom_nodes/ComfyUI-Manager
    snapshot_first: false
    # ComfyUI 0.4x 的官方装法：pip install -r manager_requirements.txt（锁 comfyui_manager==4.2.2），
    # 启动时加 --enable-manager（Desktop 自带）。不再 git clone 到 custom_nodes。
    install:
      - { type: uv_pip, env: comfy, requirements: "{comfy}/manager_requirements.txt", version: "4.2.2", source: comfyui_manager }
  - id: node_h3
    group: comfy
    name: { zh: MiniMax H3 节点, en: MiniMax H3 nodes }
    requires_cuda: true
    required: true
    depends_on: [comfy]
    # ComfyUI 自带（comfy_extras/nodes_minimax_h3.py），没有单独的节点包：更新 ComfyUI 就有
    detect: { type: comfy_node, classes: [MiniMaxH3ImageToVideo, MiniMaxH3ReferenceToVideo], native_since: "0.30.0" }
    fix: { missing: { code: update_comfy_native, params: { version: "0.30.0" } } }
    install: []
    docs: https://docs.comfy.org/tutorials/video/minimax/minimax-h3-native
  - id: node_vhs
    group: comfy
    name: { zh: VideoHelperSuite, en: VideoHelperSuite }
    depends_on: [comfy]
    detect: { type: comfy_node, dir: ComfyUI-VideoHelperSuite }
    # 没有发布 tag，锁 2026-10-18 的 main
    install: [ { type: git_clone, url: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite, ref: 4d907bee61e92c2e65af3bd6383a4e4d356126d1, dest: "{comfy}/custom_nodes/ComfyUI-VideoHelperSuite" }, { type: uv_pip, env: comfy, requirements: "{dest}/requirements.txt" } ]
  - id: node_seedvr2
    group: comfy
    name: { zh: SeedVR2 节点（本地超分）, en: SeedVR2 nodes (local upscaling) }
    requires_cuda: true
    required: true
    depends_on: [comfy]
    # ComfyUI 自带（comfy_extras/nodes_seedvr.py，v0.28.0 起，按各 tag 源码核对），用官方模板 utility_seedvr2_*；
    # 不再装社区节点包 numz/ComfyUI-SeedVR2_VideoUpscaler（Kelvin 2026-10-18 选定）
    detect: { type: comfy_node, classes: [SeedVR2Preprocess, SeedVR2Conditioning, SeedVR2PostProcessing, SeedVR2TemporalChunk, SeedVR2TemporalMerge], native_since: "0.28.0" }
    fix: { missing: { code: update_comfy_native, params: { version: "0.28.0" } }, skip: unsupported_upscale_api }
    install: []
    docs: https://docs.comfy.org/tutorials/utility/video-upscale
  - id: node_flashvsr
    group: comfy
    name: { zh: FlashVSR 节点（快速超分）, en: FlashVSR nodes (fast upscaling) }
    requires_cuda: true
    depends_on: [comfy]
    # 没有官方节点包；用 1038lab（AILab）的，和它在 Hugging Face 上的 1038lab/FlashVSR 模型说明一致。没有 tag，锁 2026-10-18 的 main
    detect: { type: comfy_node, dir: ComfyUI-FlashVSR }
    fix: { skip: unsupported_upscale_api }
    install: [ { type: git_clone, url: https://github.com/1038lab/ComfyUI-FlashVSR, ref: 8877fdd593ea93b27353956dc69edf423c561fee, dest: "{comfy}/custom_nodes/ComfyUI-FlashVSR" }, { type: uv_pip, env: comfy, requirements: "{dest}/requirements.txt" } ]
    docs: https://www.runcomfy.com/comfyui-nodes/ComfyUI-FlashVSR
  - id: node_ctrl
    group: comfy
    name: { zh: Fun ControlNet 节点, en: Fun ControlNet nodes }
    requires_cuda: true
    depends_on: [comfy]
    # ComfyUI 自带（MiniMaxH3FunControlNetApply，0.35.0 起）；权重 model_patches/minimax_h3_fun_controlnet_union_pruned_int8_convrot 等 P0
    detect: { type: comfy_node, classes: [MiniMaxH3FunControlNetApply], native_since: "0.35.0" }
    fix: { optional: { code: update_comfy_native, params: { version: "0.35.0" } } }
    install: []
    docs: https://docs.comfy.org/tutorials/video/minimax/minimax-h3-fun-controlnet
  - id: sage
    group: comfy
    name: { zh: SageAttention 加速, en: SageAttention speed-up }
    requires_cuda: true
    depends_on: [torch]
    detect: { type: py_import, env: comfy, module: sageattention }
    fix: { optional: sage_build }
    install: [ { type: uv_pip, env: comfy, packages: [sageattention], note: "Windows 可能需要预编译 wheel，失败只记录不阻塞" } ]
  - id: node_dramastudio
    group: comfy
    name: { zh: DramaStudio 节点包（素材板与存回）, en: DramaStudio nodes (boards and save-back) }
    required: true
    depends_on: [comfy]
    detect: { type: comfy_node, dir: comfyui-dramastudio }
    # 源码 integrations/comfyui-dramastudio 还没有（输入 / 输出节点 M5，镜头、素材、存回节点 M9）
    installable: false
    fix: { missing: dramastudio_pending, optional: dramastudio_pending }
    install: [ { type: copy, from: "integrations/comfyui-dramastudio", dest: "{comfy}/custom_nodes/comfyui-dramastudio" }, { type: script, run: "写入本地令牌和后端地址" } ]

  # ---------- 模型权重（Kelvin 2026-10-18 选定版本；Hugging Face 仓库锁 revision，大小和 sha256 取自 HF 接口） ----------
  # ComfyUI 用的权重写 folder，放进 ComfyUI 的模型目录（Desktop 是共享模型目录）；按官方模板（Comfy-Org/workflow_templates）配齐。
  - id: w_h3
    group: w
    name: { zh: "MiniMax H3 权重（int8）", en: "MiniMax H3 weights (int8)" }
    requires_cuda: true
    required: true
    depends_on: [comfy]
    # 官方模板 video_minimax_h3_i2v / r2v 用的全套：fl2va + ref2va（pruned int8_convrot，README：有 cu130 优先 int8）、
    # 视频 / 音频 VAE、两个加速 LoRA（和 lightx2v/Minimax-h3-Turbo 原文件 sha256 一致）
    detect: { type: downloads }
    size_gb: 49.3
    install:
      - type: download
        hf_repo: Comfy-Org/MiniMax-H3
        revision: e5eb578a89295337b8ff433a035929ce0279e0b6
        files:
          - { path: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors, folder: diffusion_models, sha256: e889202c41dafb67b10d67b97f0d8541508036a6090af23425a5c2615d03c47a }   # 20.97 GB
          - { path: diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors, folder: diffusion_models, sha256: 9255f52b6677845ad238f20dfaafa94727053694127ab7f255c048f0f9365779 }   # 20.97 GB
          - { path: vae/minimax_h3_video_vae_int8_convrot.safetensors, folder: vae, sha256: 52a2c8c73583c86e4f41cdcce3a6ad0ea562987bc0bf3d60a0cef5f5c8e60c0e }   # 2.81 GB
          - { path: vae/minimax_h3_audio_vae_fp32.safetensors, folder: vae, sha256: 8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48 }   # 0.61 GB
          - { path: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors, folder: loras, sha256: 2339acdf19bfe123f46b971ea35d367a84adb85de43627e1eceafa5a5b2b111e }   # 1.96 GB
          - { path: loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors, folder: loras, sha256: 5b9ab5ade15d0775676d01a907268a69a1468dc6033b3b0d3ded5502f3ebb84c }   # 1.96 GB
  - id: w_te
    group: w
    name: { zh: "Qwen3-VL-32B 文本编码器（NVFP4）", en: "Qwen3-VL-32B text encoder (NVFP4)" }
    requires_cuda: true
    required: true
    depends_on: [comfy]
    detect: { type: downloads }
    size_gb: 15.7
    install:
      - type: download
        hf_repo: Comfy-Org/MiniMax-H3
        revision: e5eb578a89295337b8ff433a035929ce0279e0b6
        files:
          - { path: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors, folder: text_encoders, sha256: 35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6 }   # 15.69 GB
  - id: w_img
    group: w
    name: { zh: "Qwen-Image-Edit-2511（int8）", en: "Qwen-Image-Edit-2511 (int8)" }
    required: true
    depends_on: [comfy]
    macos: { required: false, fix: { optional: mac_image_slow } }
    # 官方模板 image_qwen_image_edit_2511_int8：模型、文本编码器 Qwen2.5-VL-7B fp8、VAE、Lightning 4 步 LoRA
    detect: { type: downloads }
    size_gb: 31.0
    install:
      - type: download
        hf_repo: Comfy-Org/Qwen-Image-Edit_ComfyUI
        revision: f68ace85e60b4a02a323e394253731947657b7d2
        files:
          - { path: split_files/diffusion_models/qwen_image_edit_2511_int8_convrot.safetensors, folder: diffusion_models, sha256: 11b5af5ac601821d73930c84846c9a158e67177356daf927ce1c8d10f3963829 }   # 20.50 GB
      - type: download
        hf_repo: Comfy-Org/Qwen-Image_ComfyUI
        revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
        files:
          - { path: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors, folder: text_encoders, sha256: cb5636d852a0ea6a9075ab1bef496c0db7aef13c02350571e388aea959c5c0b4 }   # 9.38 GB
          - { path: split_files/vae/qwen_image_vae.safetensors, folder: vae, sha256: a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f }   # 0.25 GB
      - type: download
        hf_repo: lightx2v/Qwen-Image-Edit-2511-Lightning
        revision: 107d238d68b8387e32843d0b4a2e24ceb0d3ad86
        files:
          - { path: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors, folder: loras, sha256: 22226e8d05d354bb356627d428809f5afd7819399b077238a2b70a82883a904f }   # 0.85 GB
  - id: w_sr
    group: w
    name: { zh: "SeedVR2 7B 权重（int8）", en: "SeedVR2 7B weights (int8)" }
    requires_cuda: true
    required: true
    depends_on: [comfy]
    fix: { skip: unsupported_upscale_api }
    # 给 ComfyUI 自带的 SeedVR2 节点用（官方模板 utility_seedvr2_*）
    detect: { type: downloads }
    size_gb: 8.8
    install:
      - type: download
        hf_repo: Comfy-Org/SeedVR2
        revision: df48879708206a403d2a61acd55578c2e80fd233
        files:
          - { path: diffusion_models/seedvr2_7b_int8_convrot.safetensors, folder: diffusion_models, sha256: 5aa0d25fc9d35e449b659d0c9a5dcb22e2a4fa04032101b95a39da42b32c1be6 }   # 8.33 GB
          - { path: vae/seedvr2_ema_vae_fp16.safetensors, folder: vae, sha256: 20678548f420d98d26f11442d3528f8b8c94e57ee046ef93dbb7633da8612ca1 }   # 0.50 GB
  - id: w_tts
    group: w
    name: { zh: IndexTTS-2.5, en: IndexTTS-2.5 }
    required: true
    macos: { required: false, name: { zh: 本地配音模型, en: Local voice model }, fix: { optional: mac_voice_slow } }
    # 不走 ComfyUI，放安装位置下；运行环境（index-tts 源码、Python 3.10–3.11 的 uv 环境）和它运行时自己下的辅助模型
    # 等配音那个里程碑再装。小文件（配置、分词表）HF 没有 sha256，靠锁定的 revision。
    detect: { type: downloads }
    size_gb: 5.5
    install:
      - type: download
        hf_repo: IndexTeam/IndexTTS-2.5
        revision: c39ce5ba981572cb187443877ff559dfb246ce63
        dest: "{models}/IndexTTS-2.5"
        files:
          - { path: LICENSE }   # 0.00 GB
          - { path: codec.pth, sha256: d15cbed16a40f478438c961fb043f68dfa6353bf56c966761315db3433e9722c }   # 0.61 GB
          - { path: config.yaml }   # 0.00 GB
          - { path: feat1.pt, sha256: f219cb447d80216ba615666da2ff8d63ac544eee26657f3a7b278692bf7a67c4 }   # 0.00 GB
          - { path: feat2.pt, sha256: 9c4292e96dee535aea9a6206e9a0c856dd578dde9212acdb16dd3ada4d12bf80 }   # 0.00 GB
          - { path: gpt.pth, sha256: 43a8f4c30eccdf201958d3b9713511482c19d56dc20b0b1c4ee1e6b080b19d85 }   # 3.26 GB
          - { path: multilingual_zh_ja_yue_char_del.tiktoken }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/Modelfile }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/added_tokens.json }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/chat_template.jinja }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/config.json }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/generation_config.json }   # 0.00 GB
          - { path: qwen0.6bemo4-merge/merges.txt }   # 0.00 GB
