# MiniMax H3 图生视频（视频草稿，M5）。按 ComfyUI 官方模板 video_minimax_h3_i2v.json（Comfy-Org/workflow_templates，
# 2026-10-26 下载）把子图「Image to Video (MiniMax H3)」展开改写成 API 格式；节点名、输入名、可选值对照本机 ComfyUI 0.41.2
# 的 /object_info 核过（2026-10-26）。和官方不同：
# - 草稿不开 Turbo LoRA（官方开关默认关）：20 步，采样器 res_multistep、调度 simple，照官方关 Turbo 的默认
#   （Kelvin 2026-10-27 定，8 步画质不够，见 DECISIONS「本地 H3 草稿用 20 步」）；
# - 台词音频（配音方式 tts，先配音再对口型）用官方的 MiniMaxH3AddGuide 挂在第 0 帧（I2V 节点本身不收音频）；没有台词
#   音频时这个节点被旁路，I2V 的 positive 直接进引导器；
# - 尺寸按成片画幅取 768P 档（短边 768，和 H3 API 的 768P、Regenerate-2K 的输入对上），帧数照官方表达式落到 17k+5；
# - 帧率固定 24（H3 原生），25 / 30 在导出时转（PLAN「成片规格」）。
# 连续镜头的尾段引导（M5 第 15e 步，衔接方案 B，第九轮实测）：上一镜已采纳 take 的最后 22 帧连声音
# （LoadVideo → GetVideoComponents → 官方 MiniMaxH3AddGuide，钉在第 0 帧）；没给尾段时这三个节点被旁路。
#   给了尾段就去掉 I2V 的首帧锚（replaces），台词音频挪到尾段之后（dialogue_frame = 尾段帧数）。
# 尾段末帧锚（第 15h 步，第十二轮实测）：尾段只在第 0 帧贴得紧，往后会漂（第 21 帧约 20 dB），切点就跳；
#   再用一个 MiniMaxH3AddGuide 把首帧那张图（连续镜头的首帧就是上一镜最后一帧）钉在第 21 帧（= 尾段帧数 - 1，
#   media/video.py 的 TAIL_FRAMES 改了这里要跟着改），切点 20 → 36 dB。和尾段一起旁路。
# 锁定音色参考（配音方式 native 的音色样本）I2V 节点收不了，要 MiniMaxH3ReferenceToVideo，见 DECISIONS「M5 第 4 步」。
# 许可：H3 本地权重商用要 MiniMax 授权（PLAN 风险），终版走 API。
name: { zh: MiniMax H3 图生视频（草稿）, en: MiniMax H3 image to video (draft) }
kind: video
tier: recommended
bindings:
  - { slot: prompt, node: Image to video, field: prompt }
  - { slot: width, node: Image to video, field: width }
  - { slot: height, node: Image to video, field: height }
  - { slot: first_frame, node: First frame, field: image }
  - { slot: seconds, node: Duration, field: value }
  - { slot: fps, node: Video, field: fps }
  - { slot: seed, node: Noise, field: noise_seed }
  - slot: dialogue_audio
    node: Dialogue audio
    field: audio
    optional: true
    bypass: [{ node: Dialogue guide, input: positive }]
  - { slot: dialogue_frame, node: Dialogue guide, field: frame_idx }
  - slot: tail_clip
    node: Tail clip
    field: file
    optional: true
    bypass: [{ node: Tail end, input: positive }, { node: Tail guide, input: positive }, { node: Tail parts, input: video }]
    replaces: [{ node: Image to video, input: first_frame }]
  - { slot: video_out, node: Output }
models:
  - { folder: diffusion_models, name: minimax_h3_fl2va_pruned_int8_convrot.safetensors }
  - { folder: text_encoders, name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors }
  - { folder: vae, name: minimax_h3_video_vae_int8_convrot.safetensors }
  - { folder: vae, name: minimax_h3_audio_vae_fp32.safetensors }
caps:
  max_refs: 0
  fps: 24
  duration_s: [5, 15]
  audio: true
  # 跑多久 ≈ per_s × 秒数 + per_s2 × 秒数²（越长每秒越慢）。本机 5090 实测（20 步，含加载模型）：
  # 5.17 秒的 1-01 153 秒、7.29 秒的 1-08 255 秒、15 秒的长镜头 804 秒（第九轮）
  est_seconds_per_s: 17
  est_seconds_per_s2: 2.4
  verify: true
  multiple: 32
  sizes:
    "21:9": [1568, 672]
    "16:9": [1344, 768]
    "4:3": [1184, 896]
    "1:1": [1024, 1024]
    "3:4": [896, 1184]
    "9:16": [768, 1344]
  max_pixels: 1060864
