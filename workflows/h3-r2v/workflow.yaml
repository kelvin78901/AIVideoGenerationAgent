# MiniMax H3 参考生视频（视频草稿，配音方式 native 的镜头，M5；Kelvin 2026-10-26 定）。按 ComfyUI 官方模板
# video_minimax_h3_r2v.json（Comfy-Org/workflow_templates，2026-10-26 下载）改写成 API 格式；节点名、输入名、可选值对照本机
# ComfyUI 0.41.2 的 /object_info 核过（2026-10-26）。和官方不同：
# - 草稿固定开 Turbo LoRA（ref2v 4 步，官方开关默认关），采样器 res_multistep、调度 simple；
# - 首帧是 <Picture 1>（参考图 0），锁定的参考图跟在后面最多 4 张，锁定的音色样本当 <Audio 1–3>（音色参考，
#   不是原样拷贝）；没给的参考图、音色节点在填图时拿掉；
# - 首帧在这个节点里是软约束（提示词里写明它是 [Shot 1] 的第一帧），所以连续镜头的尾帧接得不如 h3-i2v 严；
# - 尺寸、帧率、时长和 h3-i2v 一样（768P 档、24 fps、5–15 秒）。
name: { zh: "MiniMax H3 参考生视频（Turbo 草稿，原生配音）", en: "MiniMax H3 reference to video (Turbo draft, native voice)" }
kind: video
tier: recommended
bindings:
  - { slot: prompt, node: Reference to video, field: prompt }
  - { slot: width, node: Reference to video, field: width }
  - { slot: height, node: Reference to video, field: height }
  - { slot: first_frame, node: First frame, field: image }
  - { slot: ref_image, index: 1, node: Reference 1, field: image, optional: true }
  - { slot: ref_image, index: 2, node: Reference 2, field: image, optional: true }
  - { slot: ref_image, index: 3, node: Reference 3, field: image, optional: true }
  - { slot: ref_image, index: 4, node: Reference 4, field: image, optional: true }
  - { slot: ref_audio, index: 1, node: Voice 1, field: audio, optional: true }
  - { slot: ref_audio, index: 2, node: Voice 2, field: audio, optional: true }
  - { slot: ref_audio, index: 3, node: Voice 3, field: audio, optional: true }
  - { slot: seconds, node: Duration, field: value }
  - { slot: fps, node: Video, field: fps }
  - { slot: seed, node: Noise, field: noise_seed }
  - { slot: video_out, node: Output }
models:
  - { folder: diffusion_models, name: minimax_h3_ref2va_pruned_int8_convrot.safetensors }
  - { folder: loras, name: minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors }
  - { folder: text_encoders, name: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors }
  - { folder: vae, name: minimax_h3_video_vae_int8_convrot.safetensors }
  - { folder: vae, name: minimax_h3_audio_vae_fp32.safetensors }
caps:
  max_refs: 4
  max_ref_audio: 3
  fps: 24
  duration_s: [5, 15]
  audio: true
  # 每秒成片大约要跑多久（5090 估的，第 14 步本机实测后改）
  est_seconds_per_s: 25
  verify: true
  multiple: 32
  sizes:
    "21:9": [1568, 672]
    "16:9": [1344, 768]
    "4:3": [1184, 896]
    "1:1": [1024, 1024]
    "3:4": [896, 1184]
    "9:16": [768, 1344]
  max_pixels: 1060864
