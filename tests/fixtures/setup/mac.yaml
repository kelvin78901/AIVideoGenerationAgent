# The Mac M4 Pro from the prototype (Setup.dc.html). Read by setup/probe.py:FakeProbe.
# Expected scan: ok 6 / warn 3 / missing 4 / optional 8 / skip 8 (29 rows; no driver row).

host: { os: macos, os_name: macOS, bits: 64, arch: arm64, ram_gb: 48, home: /Users/demo }
gpu: { name: Apple M4 Pro, vram_gb: 48, backend: mps }
default_dir: ~/DramaStudio
disks: { "/": 600 }   # free GB

commands:
  "uv python find 3.12": /Users/demo/.local/share/uv/python/cpython-3.12.9-macos-aarch64-none/bin/python3.12
  "uv --version": "uv 0.9.2 (Homebrew 2026-09-30)"
  "git --version": "git version 2.50.1 (Apple Git-155)"
  # no ffmpeg

http:
  "https://huggingface.co": { ms: 3100 }
  "https://pypi.org/simple": { ms: 210 }
  "https://github.com": { ms: 260 }
  # no ComfyUI, no Ollama / llama.cpp, no Eagle

files: []
python: {}
secrets: []
resolve: null
