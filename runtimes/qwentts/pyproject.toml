# Qwen3-TTS VoiceDesign worker environment (setup item rt_qwentts, worker workers/worker_qwentts.py).
# The installer runs `uv sync --locked` into ~/.drama-studio/envs/qwentts; regenerate the lock with
# `uv lock --project runtimes/qwentts` after changing this file (DECISIONS 2026-10-21 「第 12 步（下）」).
[project]
name = "drama-studio-rt-qwentts"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "qwen-tts==0.1.1",
    # qwen-tts names no torch; the CUDA 13.0 build covers the RTX 5090 (sm_120). torchaudio stops at
    # 2.11, so torch stays on the matching 2.11.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # qwen-tts leaves librosa open; 1.0 changed its API surface, stay on 0.x until tried
    "librosa<1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Only the qwen-tts-demo command uses gradio; the model does not import it.
exclude-dependencies = ["gradio"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
